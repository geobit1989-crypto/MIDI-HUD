name: MIDI HUD Android QA
on:
  push:
    branches: ['feature/android-native-qa-20261126']
  pull_request:
    branches: ['integration/shared-core-20261126']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HUD_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --test worker/tests/*.test.mjs
      - run: python3 scripts/sync-web-resources.py --check
      - run: node scripts/check-site.mjs
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Optional persistent QA debug key
        env:
          HUD_ANDROID_QA_KEYSTORE_B64: ${{ secrets.HUD_ANDROID_QA_KEYSTORE_B64 }}
        run: |
          if [ -n "$HUD_ANDROID_QA_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$HUD_ANDROID_QA_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo 'Ephemeral debug signing; do not use for persistent upgrades.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and test Android QA
        working-directory: native/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs native/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: midi-hud-android-qa
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
