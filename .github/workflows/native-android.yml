name: MIDI HUD Android QA
on:
  push:
    branches: [qa/midi-device-flow-20261126, 'feature/android-native-qa-20261126', integration/ajustes-aj18-android, 'fix/**']
  pull_request:
    branches: ['integration/shared-core-20261126', 'fix/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HUD_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --test worker/tests/*.test.mjs
      - run: python3 scripts/sync-web-resources.py --check
      - run: node scripts/check-site.mjs
      - name: Use runner Android SDK (no obsolete tools package)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Optional persistent QA debug key
        env:
          HUD_ANDROID_QA_KEYSTORE_B64: ${{ secrets.HUD_ANDROID_QA_KEYSTORE_B64 }}
        run: |
          if [ -n "$HUD_ANDROID_QA_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$HUD_ANDROID_QA_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo 'Ephemeral debug signing; do not use for persistent upgrades.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and test Android QA
        working-directory: native/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Android launcher identity
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging native/android/app/build/outputs/apk/debug/app-debug.apk | grep -F "application-label:'MIDI HUD'"
          python3 assets/brand/verify_android.py
      - name: Verify the Android WebView startup route in the APK
        run: |
          apk=native/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$apk" assets/index.html > /tmp/midihud-android-index.html
          unzip -p "$apk" assets/v03.html > /tmp/midihud-android-live.html
          unzip -p "$apk" assets/v03-ble-test.html > /tmp/midihud-android-ble.html
          test -s /tmp/midihud-android-live.html
          cmp /tmp/midihud-android-live.html /tmp/midihud-android-ble.html
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {runInNewContext} from 'node:vm';
          const html = readFileSync('/tmp/midihud-android-index.html', 'utf8');
          const start = new URL('https://appassets.androidplatform.net/android-qa/index.html');
          let target;
          runInNewContext(html.match(/<script>([\s\S]*?)<\/script>/)[1], {
            URL,
            navigator: {userAgent: 'Mozilla/5.0 (Linux; Android 15; wv)'},
            location: {href: start.href, search: '', hash: '', replace: url => target = new URL(url)},
          });
          assert.equal(target.origin, start.origin);
          assert.equal(target.pathname, '/android-qa/v03-ble-test.html');
          assert.equal(target.searchParams.get('home'), '1');
          JS
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs native/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: midi-hud-android-qa
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
      - name: Publish one-time Android QA prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/unified-runtime-20261127' && github.run_number == 46
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native/android/app/build/outputs/apk/debug/app-debug.apk MIDI-HUD-Android-QA.apk
          gh release create android-qa-20261128 MIDI-HUD-Android-QA.apk --target "$GITHUB_SHA" --prerelease --title "MIDI HUD Android QA 2026-11-28" --notes "QA OAuth return build; Worker deployment required. Debug signing."
