name: Deploy MIDI HUD Auth Worker

on:
  push:
    branches:
      - gh-pages
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midi-hud-auth-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy midihudaut
    runs-on: ubuntu-latest
    steps:
      - name: Check out published branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Cloudflare Worker bootstrap
        run: node --test worker/tests/*.test.mjs

      - name: Verify Cloudflare deployment configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable under GitHub Actions."
            exit 1
          fi

      - name: Deploy to existing Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Verify deployed Worker and OAuth readiness
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://midihudaut.midihudapp.workers.dev/health"
          echo "Checking Cloudflare Worker health endpoint (no credentials transmitted)..."
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 12 "$ENDPOINT" -o /tmp/midi-hud-health.json; then
              if node -e '
                const fs=require("node:fs");
                const h=JSON.parse(fs.readFileSync("/tmp/midi-hud-health.json","utf8"));
                console.log("Service:",h.service,"Stage:",h.stage,"OAuth ready:",h.oauthEnabled);
                if(h.service!=="midi-hud-auth"||h.stage!=="persistent-oauth"||h.oauthEnabled!==true) process.exit(2);
              '; then
                echo "Cloudflare Worker OAuth backend is ready."
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::Worker published, but persistent OAuth is not ready. Check Cloudflare Worker secrets and D1 database binding."
          exit 1
