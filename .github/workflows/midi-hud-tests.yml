name: MIDI HUD · Motor tests
on:
  push:
    branches: [main, feature/midi-connection-session]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check core/engine.mjs
          node --check core/midi-input.mjs
          node --check core/midi-connection-session.mjs
          node --check tests/midi-v04.test.mjs
          node --check tests/midi-connection-session.test.mjs
          node --check tests/sig-live-channel2.test.mjs
      - name: Run MIDI HUD regression suite
        run: node --test tests/*.test.mjs
