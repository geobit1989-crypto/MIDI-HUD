name: MIDI HUD iOS and synchronization
on:
  push:
    branches: ['integration/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node scripts/check-site.mjs
  ios:
    needs: web
    runs-on: macos-latest
    env:
      HUD_GOOGLE_IOS_CLIENT_ID: ${{ vars.HUD_GOOGLE_IOS_CLIENT_ID || '904503234355-emfjjsvo8n31ugt6f4a3ac3mb2gjl8jb.apps.googleusercontent.com' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure Google OAuth for the iOS IPA
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          client = os.environ.get("HUD_GOOGLE_IOS_CLIENT_ID", "").strip()
          if not client:
              print("Google OAuth iOS is not configured: building an offline-capable IPA.")
          else:
              suffix = ".apps.googleusercontent.com"
              if not re.fullmatch(r"[A-Za-z0-9_-]+\.apps\.googleusercontent\.com", client):
                  raise SystemExit("HUD_GOOGLE_IOS_CLIENT_ID has an invalid format.")
              reversed_client = "com.googleusercontent.apps." + client[:-len(suffix)]
              file = Path("native/ios/Config/Local.xcconfig")
              file.write_text("GOOGLE_IOS_CLIENT_ID = " + client + "\n" +
                              "GOOGLE_REVERSED_CLIENT_ID = " + reversed_client + "\n",
                              encoding="utf-8")
              print("Google OAuth iOS Client ID and redirect URL scheme configured.")
          PY
      - name: Prepare identical offline web resources
        run: python3 native/ios/prepare_web.py
      - name: Find available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/hud-simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/hud-simulators.json'))
          devices = [d for items in data['devices'].values() for d in items if d.get('isAvailable') and d['name'].startswith('iPhone')]
          assert devices, 'No iPhone simulator available'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('HUD_SIMULATOR=' + devices[0]['udid'] + '\n')
          PY
      - name: Compile and test native MIDI parser and offline Editor to LIVE
        # GoogleSignIn SPM products are built for arm64 on Apple Silicon.
        # Avoid mixing an x86_64 app link with arm64-only package objects.
        run: |
          xcodebuild test -project native/ios/MIDIHUD.xcodeproj -scheme MIDIHUD -configuration Debug -destination "platform=iOS Simulator,id=$HUD_SIMULATOR" -derivedDataPath build/ios-simulator -resultBundlePath build/iOS-Tests.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
      - name: Build device application without signing
        run: |
          xcodebuild build -project native/ios/MIDIHUD.xcodeproj -scheme MIDIHUD -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent build/ios-device/Build/Products/Release-iphoneos/MIDIHUD.app build/MIDIHUD-iOS-unsigned.zip
          # Sideloadly/AltStore esperan un IPA con Payload/<Nombre>.app.
          # Es un binario sin firma; la firma se aplica localmente en Windows.
          mkdir -p build/ios-unsigned-ipa/Payload
          ditto build/ios-device/Build/Products/Release-iphoneos/MIDIHUD.app build/ios-unsigned-ipa/Payload/MIDIHUD.app
          (cd build/ios-unsigned-ipa && zip -qry ../MIDIHUD-iOS-unsigned.ipa Payload)
          unzip -t build/MIDIHUD-iOS-unsigned.ipa
      - name: Verify embedded iOS OAuth configuration
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          plist_path = Path("build/ios-device/Build/Products/Release-iphoneos/MIDIHUD.app/Info.plist")
          with plist_path.open("rb") as stream:
              info = plistlib.load(stream)
          client = os.environ.get("HUD_GOOGLE_IOS_CLIENT_ID", "").strip()
          embedded = info.get("GIDClientID", "")
          schemes = [value for item in info.get("CFBundleURLTypes", []) for value in item.get("CFBundleURLSchemes", [])]
          if client:
              expected_scheme = "com.googleusercontent.apps." + client.removesuffix(".apps.googleusercontent.com")
              if embedded != client or expected_scheme not in schemes:
                  raise SystemExit("OAuth iOS configuration was not embedded correctly.")
              print("Verified embedded Google OAuth iOS configuration.")
          elif embedded:
              raise SystemExit("Unexpected Google OAuth identifier in unconfigured IPA.")
          else:
              print("Verified offline-only IPA with no Google OAuth credentials.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midi-hud-ios-build-and-tests
          path: |
            build/MIDIHUD-iOS-unsigned.zip
            build/MIDIHUD-iOS-unsigned.ipa
            build/iOS-Tests.xcresult
          retention-days: 14
