name: MIDI HUD iOS and synchronization
on:
  push:
    branches: [gh-pages, 'feature/**']
    paths: ['beta-v3.4/**', 'native/**', '.github/workflows/native-ios.yml']
  pull_request:
    paths: ['beta-v3.4/**', 'native/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test beta-v3.4/tests/*.test.mjs
      - run: node beta-v3.4/tests/check-site.mjs
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare identical offline web resources
        run: python3 native/ios/prepare_web.py
      - name: Find available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/hud-simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/hud-simulators.json'))
          devices = [d for items in data['devices'].values() for d in items if d.get('isAvailable') and d['name'].startswith('iPhone')]
          assert devices, 'No iPhone simulator available'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('HUD_SIMULATOR=' + devices[0]['udid'] + '\n')
          PY
      - name: Compile and test native MIDI parser and offline Editor to LIVE
        # GoogleSignIn SPM products are built for arm64 on Apple Silicon.
        # Avoid mixing an x86_64 app link with arm64-only package objects.
        run: |
          xcodebuild test -project native/ios/MIDIHUD.xcodeproj -scheme MIDIHUD -configuration Debug -destination "platform=iOS Simulator,id=$HUD_SIMULATOR" -derivedDataPath build/ios-simulator -resultBundlePath build/iOS-Tests.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
      - name: Build device application without signing
        run: |
          xcodebuild build -project native/ios/MIDIHUD.xcodeproj -scheme MIDIHUD -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent build/ios-device/Build/Products/Release-iphoneos/MIDIHUD.app build/MIDIHUD-iOS-unsigned.zip
          # Sideloadly/AltStore esperan un IPA con Payload/<Nombre>.app.
          # Es un binario sin firma; la firma se aplica localmente en Windows.
          mkdir -p build/ios-unsigned-ipa/Payload
          ditto build/ios-device/Build/Products/Release-iphoneos/MIDIHUD.app build/ios-unsigned-ipa/Payload/MIDIHUD.app
          (cd build/ios-unsigned-ipa && zip -qry ../MIDIHUD-iOS-unsigned.ipa Payload)
          unzip -t build/MIDIHUD-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midi-hud-ios-build-and-tests
          path: |
            build/MIDIHUD-iOS-unsigned.zip
            build/MIDIHUD-iOS-unsigned.ipa
            build/iOS-Tests.xcresult
          retention-days: 14
