name: MIDI HUD engine tests
on:
  push:
    branches: ["main","feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check editor/v2.mjs && node --check editor/editor-model.mjs && node --test tests/engine-v1.test.mjs tests/editor-model.test.mjs tests/editor-ui.test.mjs
