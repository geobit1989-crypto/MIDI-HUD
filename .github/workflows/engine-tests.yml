name: MIDI HUD unified regression tests
on:
  push:
    branches: ['integration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/sync-web-resources.py --check
      - run: node --test tests/*.test.mjs
      - run: node --test worker/tests/*.test.mjs
      - run: node scripts/check-site.mjs
      - run: python3 native/ios/prepare_web.py
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-browser-evidence
          path: build/browser/
