name: MIDI HUD unified regression tests
on:
  push:
    branches: [qa/midi-device-flow-20261126, 'integration/**', 'test/ios-midi-hud-20261123', 'feature/live-ui-20261124', 'fix/**', 'feature/editor-optimization-20261128']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/sync-web-resources.py --check
      - name: Unit tests with per-file diagnostics
        timeout-minutes: 3
        shell: bash
        run: |
          failed=0
          for file in tests/*.test.mjs; do
            echo "::group::$file"
            rc=0
            timeout --kill-after=5s 25s node --test --test-reporter=spec "$file" || rc=$?
            echo "Exit status: $rc ($file)"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$file::Unit test file failed or timed out (exit $rc)"
              failed=1
            fi
          done
          exit "$failed"
      - run: node --test worker/tests/*.test.mjs
      - run: node scripts/check-site.mjs
      - run: python3 native/ios/prepare_web.py
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-integration.mjs
      - run: node tests/release-browser.mjs
      - name: Package the canonical Web QA application
        run: |
          mkdir -p build/qa
          git archive --format=zip --output=build/qa/midi-hud-web-qa.zip HEAD \
            index.html v03.html v03-ble-test.html core editor live config assets \
            privacy.html privacy-en.html terms.html terms-en.html
      - uses: actions/upload-artifact@v4
        with:
          name: midi-hud-web-qa
          path: build/qa/midi-hud-web-qa.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-browser-evidence
          path: build/browser/
