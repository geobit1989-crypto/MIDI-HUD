<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIDI HUD v0.2</title><style>:root{font-family:system-ui;color:#fff;background:#0a0d12}body{max-width:650px;margin:auto;padding:15px}header,.panel{background:#141b25;border-radius:12px;padding:15px;margin-bottom:12px}h1{margin:4px 0}.muted{color:#aeb8c6;font-size:12px}.flex{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.switch{min-height:90px;background:#202938;color:white;border:2px solid var(--c);border-radius:10px;font-weight:700;overflow-wrap:anywhere}.switch.on{background:color-mix(in srgb,var(--c) 40%,#202938)}button,select,input{font:inherit}button,select{background:#263345;color:white;border:1px solid #5e718a;border-radius:7px;padding:8px}input{background:#263345;color:white;border:1px solid #5e718a;padding:8px;border-radius:7px;box-sizing:border-box;width:100%}label{display:block;margin:10px 0}label span{display:block;margin-bottom:3px}.hidden{display:none}.status{font-size:13px;color:#aeb8c6;margin:12px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.switch small{display:block;margin-bottom:5px}</style><body><header class="flex"><div><div class="muted" id="num">PRESET 01</div><h1 id="title">MIDI HUD</h1></div><div><div class="muted">BPM</div><strong id="bpm" style="font-size:30px">120</strong></div></header><div class="actions"><select id="preset"></select><button id="duplicate">Duplicar</button><button id="mode">Configurar</button><button id="export">Exportar JSON</button><label style="margin:0"><input id="import" type="file" accept=".json,application/json" hidden><button type="button" id="importbtn">Importar</button></label></div><div class="grid" id="grid"></div><div class="panel" style="margin-top:12px"><strong>Expresión (simulada)</strong><label>Morph <input type="range" id="morph" min="0" max="127" value="127"></label><label>Wah / Whammy <input type="range" id="wah" min="0" max="127" value="0"></label></div><div class="panel hidden" id="editor"><strong>Editor de asignaciones</strong><label><span>Nombre del preset</span><input id="name"></label><label><span>BPM</span><input id="tempo" type="number" min="30" max="300"></label><label><span>Footswitch</span><select id="control"></select></label><label><span>Etiqueta</span><input id="label"></label><label><span>Acción</span><select id="action"><option value="toggle">Alternar efecto</option><option value="momentary">Momentáneo</option><option value="tap">Tap Tempo</option><option value="preset">Cambiar preset</option></select></label><label><span>Mensaje MIDI (provisional)</span><select id="type"><option value="CC">Control Change</option><option value="PC">Program Change</option><option value="none">Ninguno</option></select></label><label><span>Canal MIDI (1–16)</span><input id="channel" type="number" min="1" max="16"></label><label><span>Número CC/PC (0–127)</span><input id="number" type="number" min="0" max="127"></label><label><span>Color</span><input id="color" type="color"></label><button id="save">Guardar asignación</button></div><p class="status" id="status" aria-live="polite">Simulación local. Sin comunicación MIDI real.</p><script>
const KEY='midi-hud-v02';const ids=['AC1','AC2','SW1','SW2','AC3','AC4','GT1','GT2','GT3'];const colors=['#168dff','#168dff','#ffffff','#f6d320','#16c878','#f53b40','#ff871b','#f53b40','#f6d320'];function make(name,bpm,labels){return {name,bpm,controls:ids.map((id,i)=>({id,label:labels[i],color:colors[i],action:i===3?'tap':'toggle',midi:{type:'CC',channel:1,number:20+i}}))}}const defaults=[make('Ambient Worship',120,['Clean','Ambience','Tuner','Tap Tempo','Modulation','Solo','OD','Dist','Delay']),make('Rock Base',105,['Clean','Crunch','Tuner','Tap Tempo','Drive','Solo','Boost','Dist','Delay'])];let presets;try{let d=JSON.parse(localStorage.getItem(KEY));presets=valid(d)?d:structuredClone(defaults)}catch(e){presets=structuredClone(defaults)}let idx=0,selected=0,editing=false,active={},taps=[];const $=id=>document.getElementById(id);function valid(d){return Array.isArray(d)&&d.length>0&&d.length<200&&d.every(p=>typeof p.name==='string'&&Number.isFinite(p.bpm)&&Array.isArray(p.controls)&&p.controls.length===9&&p.controls.every(c=>typeof c.id==='string'&&typeof c.label==='string'&&typeof c.color==='string'&&typeof c.action==='string'&&c.midi&&['CC','PC','none'].includes(c.midi.type)&&Number.isInteger(c.midi.channel)&&c.midi.channel>=1&&c.midi.channel<=16&&Number.isInteger(c.midi.number)&&c.midi.number>=0&&c.midi.number<=127))}function persist(){try{localStorage.setItem(KEY,JSON.stringify(presets))}catch(e){$('status').textContent='No se pudo guardar localmente. Exporta JSON como respaldo.'}}function message(c,value){return c.midi.type==='none'?'sin MIDI':c.midi.type+' canal '+c.midi.channel+' número '+c.midi.number+(c.midi.type==='CC'?' valor '+value:'')}function tap(){let now=Date.now();taps=taps.filter(t=>now-t<2500);taps.push(now);if(taps.length>1){let intervals=taps.slice(1).map((v,i)=>v-taps[i]);presets[idx].bpm=Math.max(30,Math.min(300,Math.round(60000/(intervals.reduce((a,b)=>a+b,0)/intervals.length))));persist()}}function press(c){if(editing){selected=ids.indexOf(c.id);fields();return}if(c.action==='tap')tap();else if(c.action==='preset'){idx=(idx+1)%presets.length;active={}}else active[c.id]=!active[c.id];$('status').textContent=c.id+' · '+c.label+' → '+message(c,active[c.id]?127:0)+' (simulado)';render()}function render(){let p=presets[idx];$('title').textContent=p.name;$('num').textContent='PRESET '+String(idx+1).padStart(2,'0');$('bpm').textContent=p.bpm;$('preset').replaceChildren(...presets.map((p,i)=>{let o=new Option((i+1)+' · '+p.name,i);return o}));$('preset').value=idx;$('grid').replaceChildren(...p.controls.map(c=>{let b=document.createElement('button');b.className='switch'+(active[c.id]?' on':'');b.style.setProperty('--c',c.color);let s=document.createElement('small');s.textContent=c.id;b.append(s,document.createTextNode(c.label));b.onclick=()=>press(c);return b}));$('editor').classList.toggle('hidden',!editing);$('mode').textContent=editing?'Interpretar':'Configurar';if(editing){$('name').value=p.name;$('tempo').value=p.bpm;$('control').replaceChildren(...p.controls.map((c,i)=>new Option(c.id,i)));fields()}}function fields(){let c=presets[idx].controls[selected];$('control').value=selected;$('label').value=c.label;$('action').value=c.action;$('type').value=c.midi.type;$('channel').value=c.midi.channel;$('number').value=c.midi.number;$('color').value=c.color}function bounded(v,min,max){let n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.round(n))):min}$('preset').onchange=e=>{idx=Number(e.target.value);selected=0;active={};render()};$('duplicate').onclick=()=>{let p=structuredClone(presets[idx]);p.name+=' (copia)';presets.push(p);idx=presets.length-1;active={};persist();render()};$('mode').onclick=()=>{editing=!editing;render()};$('control').onchange=e=>{selected=Number(e.target.value);fields()};$('save').onclick=()=>{let p=presets[idx],c=p.controls[selected];p.name=$('name').value.trim()||p.name;p.bpm=bounded($('tempo').value,30,300);c.label=$('label').value.trim()||c.label;c.action=$('action').value;c.midi={type:$('type').value,channel:bounded($('channel').value,1,16),number:bounded($('number').value,0,127)};c.color=$('color').value;persist();render();$('status').textContent='Asignación guardada localmente'};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(presets,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='midi-hud-presets-v02.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importbtn').onclick=()=>$('import').click();$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!valid(d))throw Error('Formato no válido');presets=d;idx=0;selected=0;active={};persist();render();$('status').textContent='Configuraciones importadas'}catch(err){$('status').textContent='Importación rechazada: '+err.message}e.target.value=''};['morph','wah'].forEach(id=>$(id).oninput=e=>{$('status').textContent=id.toUpperCase()+' · CC simulado valor '+e.target.value});render();</script></body></html>
