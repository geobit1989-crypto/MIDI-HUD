<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIG · Prototipo</title>
<style>
:root{font-family:system-ui;background:#0a0d12;color:white}body{margin:0;padding:15px;max-width:650px;margin:auto}header{background:#000;border-radius:12px;padding:15px;margin-bottom:12px}h1{font-size:24px;margin:3px 0}.sub{color:#9ea9b9;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}button,input,select{font:inherit}button{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button,select{background:#202938;color:white;border:1px solid #526071;border-radius:8px;padding:9px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tile{min-height:96px;border-radius:11px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 20%,#10151c);color:white;padding:7px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:700;text-align:center;overflow-wrap:anywhere}.tile small{font-size:11px;color:#d6dce5}.tile.active{background:color-mix(in srgb,var(--c) 48%,#10151c)}.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pedals{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:12px 10px}.pedal{height:155px;border:3px solid var(--c);border-radius:16px;background:color-mix(in srgb,var(--c) 17%,#090d13);color:white;font-weight:bold}.pedal span{display:block;background:var(--c);width:5px;height:60px;margin:10px auto;border-radius:5px}.edit{margin-top:20px;border-top:1px solid #38404c;padding-top:12px}label{display:block;margin:9px 0;font-size:13px}input{box-sizing:border-box;width:100%;padding:10px;border-radius:7px;background:#1b2430;color:white;border:1px solid #637184}#status{color:#9ea9b9;font-size:13px;margin-top:8px} .hidden{display:none}@media(min-width:550px){.tile{min-height:110px}.pedals{margin-inline:75px}}</style>
<body><header><div class="top"><div><div class="sub" id="number">PRESET 01</div><h1 id="title">Ambient Worship</h1></div><div style="text-align:right"><div class="sub">BPM</div><strong id="bpm" style="font-size:32px">120</strong></div></div></header>
<div class="actions"><select id="preset" aria-label="Seleccionar preset"></select><button id="duplicate">Duplicar preset</button><button id="mode">Configurar</button></div>
<div class="grid" id="toprow"></div><div class="row2" id="acrow"></div><div class="row3" id="gtrow"></div><div class="pedals"><button class="pedal" style="--c:#ae59fa" data-pedal="morph"><span></span>MORPH</button><button class="pedal" style="--c:#05cce7" data-pedal="wah"><span></span><span style="display:inline;background:none">WAH / WHAMMY</span></button></div>
<div id="editor" class="edit hidden"><strong>Editar preset visual</strong><label>Nombre<input id="name"></label><label>BPM inicial<input id="tempo" type="number" min="30" max="300"></label><label>Control seleccionado<select id="control"></select></label><label>Nombre del control<input id="controlname"></label><label>Color<select id="color"><option value="#168dff">Azul · limpio/ambiente</option><option value="#16c878">Verde · modulación</option><option value="#ff871b">Naranja · overdrive</option><option value="#f53b40">Rojo · solo/distorsión</option><option value="#f6d320">Amarillo · delay/tap</option><option value="#ffffff">Blanco · utilidad</option></select></label><button id="save">Guardar cambios</button></div>
<p id="status" aria-live="polite">Modo simulación: sin conexión MIDI real. Los cambios se mantienen durante esta sesión.</p>
<script>
const initial=[{name:'Ambient Worship',bpm:120,controls:[['AC1','Clean','#168dff'],['AC2','Ambience','#168dff'],['SW1','Tuner','#ffffff'],['SW2','Tap Tempo','#f6d320'],['AC3','Modulation','#16c878'],['AC4','Solo','#f53b40'],['GT1','OD','#ff871b'],['GT2','Dist','#f53b40'],['GT3','Delay','#f6d320']]},{name:'Rock Base',bpm:105,controls:[['AC1','Clean','#168dff'],['AC2','Crunch','#ff871b'],['SW1','Tuner','#ffffff'],['SW2','Tap Tempo','#f6d320'],['AC3','Drive','#ff871b'],['AC4','Solo','#f53b40'],['GT1','Boost','#ff871b'],['GT2','Dist','#f53b40'],['GT3','Delay','#f6d320']]}];
let presets=initial,idx=0,editing=false,selected=0,active={};const $=id=>document.getElementById(id);function render(){let p=presets[idx];$('title').textContent=p.name;$('number').textContent='PRESET '+String(idx+1).padStart(2,'0');$('bpm').textContent=p.bpm;$('preset').innerHTML=presets.map((x,i)=>`<option value="${i}">${i+1} · ${x.name.replaceAll('<','&lt;')}</option>`).join('');$('preset').value=idx;function tiles(start,end,target){$(target).replaceChildren(...p.controls.slice(start,end).map(([id,name,c],j)=>{let b=document.createElement('button');b.className='tile'+(active[id]?' active':'');b.style.setProperty('--c',c);let s=document.createElement('small');s.textContent=id;b.append(s,document.createTextNode(name));b.onclick=()=>{if(editing){selected=start+j;editFields()}else{if(name.toLowerCase().includes('tap')){tap()}else{active[id]=!active[id];$('status').textContent=id+' · '+name+' (simulado)';render()}}};return b}))}tiles(0,4,'toprow');tiles(4,6,'acrow');tiles(6,9,'gtrow');$('editor').classList.toggle('hidden',!editing);if(editing){$('name').value=p.name;$('tempo').value=p.bpm;$('control').innerHTML=p.controls.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('');editFields()}}
function editFields(){$('control').value=selected;$('controlname').value=presets[idx].controls[selected][1];$('color').value=presets[idx].controls[selected][2]}
let taps=[];function tap(){let now=Date.now();taps=taps.filter(t=>now-t<2500);taps.push(now);if(taps.length>=2){let gaps=taps.slice(1).map((t,i)=>t-taps[i]);presets[idx].bpm=Math.round(60000/(gaps.reduce((a,b)=>a+b,0)/gaps.length));presets[idx].bpm=Math.max(30,Math.min(300,presets[idx].bpm))}$('status').textContent='Tap Tempo simulado';render()}
$('preset').onchange=e=>{idx=Number(e.target.value);active={};taps=[];render()};$('duplicate').onclick=()=>{presets.push(JSON.parse(JSON.stringify(presets[idx])));presets.at(-1).name+=' (copia)';idx=presets.length-1;active={};render()};$('mode').onclick=()=>{editing=!editing;$('mode').textContent=editing?'Interpretar':'Configurar';render()};$('control').onchange=e=>{selected=Number(e.target.value);editFields()};$('save').onclick=()=>{let p=presets[idx],b=Number($('tempo').value);p.name=$('name').value.trim()||p.name;p.bpm=Number.isFinite(b)?Math.max(30,Math.min(300,b)):120;p.controls[selected][1]=$('controlname').value.trim()||p.controls[selected][1];p.controls[selected][2]=$('color').value;$('status').textContent='Cambios aplicados en esta sesión';render()};document.querySelectorAll('[data-pedal]').forEach(b=>b.onclick=()=>{$('status').textContent=b.dataset.pedal.toUpperCase()+' · simulación de pedal de expresión'});render();
</script></body></html>
