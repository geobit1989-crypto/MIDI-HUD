<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIDI HUD · LIVE</title>
<style>
:root{font-family:system-ui;color:#eef5ff;background:#0b1019}body{max-width:640px;margin:auto;padding:18px}h1{margin-bottom:0}small{color:#9fb2c9}.panel{background:#192433;padding:17px;border-radius:14px;margin:16px 0}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}button{border:1px solid #66809b;background:#253447;color:white;padding:15px 5px;border-radius:10px;font:inherit}button.active{background:#087c9a;border-color:#30c9e9}input{width:100%;accent-color:#28c5e6}output{float:right}strong{font-size:23px}#status{font-size:13px;color:#b8cee2}
.io{display:flex;gap:8px;flex-wrap:wrap}.io button{flex:1}.io input{display:none}#ioStatus{display:block;margin-top:8px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.gear{width:44px;height:44px;flex:none;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;font-size:23px;padding:4px}.gear::after{content:"";position:absolute;bottom:0;left:0;height:3px;width:var(--hold,0%);background:#30c9e9;border-radius:3px}.gear:focus-visible{outline:2px solid #30c9e9}.gearNote{display:block;min-height:18px}</style>
<div class="topbar"><h1>MIDI HUD</h1><button class="gear" id="settingsGear" aria-label="Mantener pulsado dos segundos para abrir Configuración" title="Mantén pulsado 2 segundos">⚙</button></div><small>LIVE · Worship · visualización de prueba sin MIDI real</small><small class="gearNote" id="gearNote" aria-live="polite"></small>
<nav><button data-i="0">1 CLEAN</button><button data-i="1">2 DRIVE</button><button data-i="2">3 SOLO</button></nav>
<div class="panel"><small>ESTADO ACTIVO</small><p><strong id="title"></strong></p><p id="tone"></p></div>
<div class="panel"><label for="morph">MORPH <output id="mv"></output></label><input id="morph" type="range" min="0" max="100"><p id="effect"></p></div>
<div class="panel"><label for="volume">VOLUMEN GLOBAL <output id="vv"></output></label><input id="volume" type="range" min="0" max="100"><p id="status"></p></div>
<div class="panel" id="settingsPanel"><strong>Repertorio</strong><p id="songName">Worship - demo</p><div class="io"><a href="../editor/" style="color:#80d9f2">Configuración</a><button id="exportBtn">Exportar JSON</button><button id="importBtn">Importar JSON</button><input id="fileInput" type="file" accept=".json,application/json"></div><small id="ioStatus" role="status">Configuración de demostración</small></div><small>Los parámetros son aproximaciones visuales. No se envían mensajes MIDI a la GT-1000CORE.</small>
<script>
const gear=document.querySelector("#settingsGear"),gearNote=document.querySelector("#gearNote");let holdTimer=null,holdFrame=null,holdStart=0,activated=false;
function stopHold(){clearTimeout(holdTimer);cancelAnimationFrame(holdFrame);holdTimer=null;holdFrame=null;gear.style.setProperty("--hold","0%")}
function holdProgress(){const pct=Math.min(100,((performance.now()-holdStart)/2000)*100);gear.style.setProperty("--hold",pct+"%");if(holdTimer!==null)holdFrame=requestAnimationFrame(holdProgress)}
gear.addEventListener("pointerdown",e=>{if(e.button!==0)return;e.preventDefault();activated=false;stopHold();holdStart=performance.now();gear.setPointerCapture(e.pointerId);gearNote.textContent="Mantén pulsado para abrir Configuración…";holdTimer=setTimeout(()=>{activated=true;stopHold();gearNote.textContent="Abriendo Configuración";window.location.href="../editor/"},2000);holdProgress()});
["pointerup","pointercancel","lostpointercapture"].forEach(type=>gear.addEventListener(type,()=>{if(!activated&&holdTimer!==null){stopHold();gearNote.textContent="Mantén pulsado durante 2 segundos"}}));
gear.addEventListener("contextmenu",e=>e.preventDefault());
const presets=[{name:"Crystal Clean",drive:0,boost:0,reverb:10,delay:8},{name:"Worship Overdrive",drive:35,boost:0,reverb:18,delay:20},{name:"Worship Solo",drive:55,boost:0,reverb:20,delay:28}];
const DEFAULT_URL="../config/midi-hud-data-v1.json";let library=null;
function validLibrary(x){return x&&x.format==="midi-hud-repertoire"&&x.schemaVersion==="1.0.0"&&typeof x.libraryId==="string"&&Number.isInteger(x.revision)&&x.midi&&Array.isArray(x.repertoires)&&Array.isArray(x.songs)&&Array.isArray(x.presets)&&x.presets.length>0&&x.presets.every(p=>typeof p.id==="string"&&typeof p.name==="string"&&Number.isInteger(p.programChange)&&p.morph&&Number.isInteger(p.morph.onLoad)&&p.morph.onLoad>=0&&p.morph.onLoad<=127)&&x.songs.every(song=>Array.isArray(song.presetIds)&&song.presetIds.every(id=>x.presets.some(p=>p.id===id)))&&x.repertoires.every(rep=>Array.isArray(rep.songIds)&&rep.songIds.every(id=>x.songs.some(song=>song.id===id)))}
function applyLibrary(x){if(!validLibrary(x))throw Error("Formato inválido o versión no compatible");library=x;const rep=x.repertoires[0],song=x.songs.find(z=>z.id===rep?.songIds?.[0])||x.songs[0];const chosen=(song?.presetIds||[]).map(id=>x.presets.find(p=>p.id===id)).filter(Boolean).slice(0,3);if(!chosen.length)throw Error("No hay presets en la primera canción");presets.splice(0,presets.length,...chosen.map(p=>({name:p.name,drive:p.morph.assignment==="soloBoost"?55:p.morph.assignment==="none"?35:0,morph:p.morph})));document.querySelector("#songName").textContent=song?.title||rep?.name||"Repertorio";document.querySelectorAll("nav button").forEach((b,i)=>{b.hidden=i>=presets.length;if(presets[i])b.textContent=(i+1)+" "+presets[i].name.toUpperCase()});state=0;morph.value=0;draw();document.querySelector("#ioStatus").textContent="Cargado: "+(rep?.name||x.libraryId)+" · revisión "+x.revision}
async function loadDefault(){try{const saved=localStorage.getItem("hudLibrary");if(saved){applyLibrary(JSON.parse(saved));return}const response=await fetch(DEFAULT_URL);if(!response.ok)throw Error("No se pudo cargar el ejemplo");applyLibrary(await response.json())}catch(e){document.querySelector("#ioStatus").textContent="Ejemplo integrado. "+e.message}}
document.querySelector("#exportBtn").onclick=()=>{if(!library){document.querySelector("#ioStatus").textContent="Espera a cargar un repertorio";return}const file=new Blob([JSON.stringify(library,null,2)],{type:"application/json"});const url=URL.createObjectURL(file),a=document.createElement("a");a.href=url;a.download="MIDI-HUD-repertorio.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);document.querySelector("#ioStatus").textContent="Archivo preparado para guardar o compartir"};
document.querySelector("#importBtn").onclick=()=>document.querySelector("#fileInput").click();
document.querySelector("#fileInput").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>500000)throw Error("Archivo demasiado grande");const x=JSON.parse(await f.text());if(!validLibrary(x))throw Error("Archivo JSON no compatible");applyLibrary(x);localStorage.setItem("hudLibrary",JSON.stringify(x))}catch(err){document.querySelector("#ioStatus").textContent="No se importó: "+err.message}e.target.value=""};
let state=Math.min(2,Math.max(0,Number(localStorage.getItem("hudState")||0)));
const morph=document.querySelector("#morph"),volume=document.querySelector("#volume");
morph.value=0;volume.value=localStorage.getItem("hudVolume")??100;
function draw(){const p=presets[state],m=Number(morph.value)/100,assignment=p.morph?.assignment||(state===0?"ambient":state===2?"soloBoost":"none"),params=p.morph?.parameters||{};document.querySelectorAll("nav button").forEach((b,i)=>b.classList.toggle("active",i===state));document.querySelector("#title").textContent=p.name;document.querySelector("#tone").textContent="Twin Reverb '65 · Drive "+p.drive+"%";morph.disabled=assignment==="none";document.querySelector("#mv").textContent=assignment==="none"?"sin asignación":Math.round(m*100)+"% · MIDI "+Math.round(m*127)+"/127";document.querySelector("#effect").textContent=assignment==="ambient"?"Ambiente: reverb larga "+Math.round((params.reverbLongPercent?.[0]??10)+((params.reverbLongPercent?.[1]??75)-(params.reverbLongPercent?.[0]??10))*m)+"% · delay "+Math.round((params.delayPercent?.[0]??8)+((params.delayPercent?.[1]??60)-(params.delayPercent?.[0]??8))*m)+"%":assignment==="soloBoost"?"Boost solo: +"+((params.boostDb?.[0]??0)+((params.boostDb?.[1]??3)-(params.boostDb?.[0]??0))*m).toFixed(1)+" dB":"Overdrive estable · sin Morph";document.querySelector("#vv").textContent=volume.value+"%";document.querySelector("#status").textContent=Number(volume.value)===0?"Silencio global (ambas rutas)":"Volumen de ambas rutas: "+volume.value+"%";localStorage.setItem("hudState",state);localStorage.setItem("hudVolume",volume.value)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{state=Number(b.dataset.i);morph.value=0;draw()});morph.oninput=draw;volume.oninput=draw;draw();loadDefault();window.addEventListener("pageshow",()=>{const saved=localStorage.getItem("hudLibrary");if(saved){try{const x=JSON.parse(saved);if(!library||JSON.stringify(x)!==JSON.stringify(library))applyLibrary(x)}catch(e){document.querySelector("#ioStatus").textContent="Error al actualizar repertorio: "+e.message}}});
</script></html>
