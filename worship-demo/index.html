<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIDI HUD · LIVE</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f4f4f4;background:#000}*{box-sizing:border-box}body{max-width:720px;margin:auto;padding:18px;background:#000}h1{font-size:clamp(22px,5vw,32px);font-weight:500;margin:0}small{color:#aaa}.topbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 25px}.gear{background:transparent;border:0;color:#ccc;font-size:28px;width:48px;height:48px;position:relative;touch-action:none;user-select:none}.gear::after{content:"";position:absolute;bottom:0;left:0;height:3px;width:var(--hold,0%);background:#22a5be}.gearNote{display:block;min-height:14px;font-size:11px}.panel{background:#242424;border-radius:22px;padding:22px;margin:18px 0}button{cursor:pointer;color:#fff;font:inherit}#songPanel{text-align:center;padding:20px 14px}#songPanel .songbar{display:flex;align-items:center;justify-content:space-between;gap:10px}#songPanel .songbar button{border:0;background:transparent;font-size:28px;padding:10px}#songPicker{width:100%;min-width:0;text-align:center;appearance:none;background:transparent;color:#fff;border:0;font-weight:650;font-size:clamp(18px,4.5vw,27px)}#songPicker option{background:#222}#songCounter{display:block;color:#aaa;letter-spacing:1px;text-transform:uppercase}#songTempo{display:block;margin-top:8px;font-size:17px}#presetNav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}#presetNav button,.virtualTile{background:#242424;border:1px solid #373737;border-radius:15px;min-height:100px;padding:14px 5px;overflow-wrap:anywhere;font-size:clamp(12px,3vw,18px);font-weight:500}#presetNav button.active{background:#002127;border-color:#075469;box-shadow:inset 0 0 0 1px #073544}#presetNav button .num{display:block;color:#999;font-size:16px;margin-bottom:9px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meters .panel{margin:0;padding:18px}.meters label{font-size:18px}.meters input{width:100%;accent-color:#249db4;margin:18px 0 8px}.meters output{color:#aaa;display:block}.detail{font-size:12px;color:#aaa;margin-top:18px}.io{display:flex;gap:8px;flex-wrap:wrap}.io button{background:#333;border:1px solid #555;border-radius:8px;padding:10px}.io input{display:none}#ioStatus{display:block;margin-top:10px}a{color:#6acde5}#settingsPanel{margin-top:25px}#settingsPanel strong{font-size:18px}@media(max-width:390px){body{padding:10px}#presetNav{gap:7px}#presetNav button{min-height:83px}.meters .panel{padding:12px}}
</style>
<div class="topbar"><h1>MIDI HUD — LIVE</h1><button class="gear" id="settingsGear" aria-label="Mantén pulsado dos segundos para abrir Configuración">⚙</button></div><small class="gearNote" id="gearNote" aria-live="polite"></small>
<div class="panel" id="songPanel"><span id="songCounter">CANCIÓN 1 DE 1</span><div class="songbar"><button id="prevSong" aria-label="Anterior">❮</button><select id="songPicker" aria-label="Canción"></select><button id="nextSong" aria-label="Siguiente">❯</button></div><small id="songTempo"></small></div>
<nav id="presetNav" aria-label="Estados de la canción"></nav>
<div class="meters"><div class="panel"><label for="morph">MORPH</label><input id="morph" type="range" min="0" max="100"><output id="mv">0%</output></div><div class="panel"><label for="wah">WAH / EXP</label><input id="wah" type="range" min="0" max="100" value="0"><output id="wv">0%</output></div></div>
<div class="detail" aria-live="polite"><span id="title"></span> · <span id="tone"></span><br><span id="effect"></span></div>
<div class="panel" id="settingsPanel"><strong>Repertorio</strong><p id="songName"></p><div class="io"><a href="../editor/">Configuración</a><button id="exportBtn">Exportar JSON</button><button id="importBtn">Importar JSON</button><input id="fileInput" type="file" accept=".json,application/json"></div><small id="ioStatus" role="status"></small></div>
<div hidden><input id="volume" type="range" min="0" max="100" value="100"><output id="vv"></output><span id="status"></span></div><small>Visualización de prueba · sin conexión MIDI real.</small>
<script>
const isLab=new URLSearchParams(location.search).get("lab")==="1";const libraryStorageKey=isLab?"hudLabLibrary":"hudLibrary",volumeStorageKey=isLab?"hudLabVolume":"hudVolume",stateStorageKey=isLab?"hudLabState":"hudState";if(isLab){document.title="MIDI HUD · LAB";document.querySelector("h1").textContent="MIDI HUD — LAB";document.querySelector("#settingsGear").hidden=true;document.querySelector("#settingsPanel a").hidden=true;}const gear=document.querySelector("#settingsGear"),gearNote=document.querySelector("#gearNote");let holdTimer=null,holdFrame=null,holdStart=0,activated=false;
function stopHold(){clearTimeout(holdTimer);cancelAnimationFrame(holdFrame);holdTimer=null;holdFrame=null;gear.style.setProperty("--hold","0%")}
function holdProgress(){const pct=Math.min(100,((performance.now()-holdStart)/2000)*100);gear.style.setProperty("--hold",pct+"%");if(holdTimer!==null)holdFrame=requestAnimationFrame(holdProgress)}
gear.addEventListener("pointerdown",e=>{if(e.button!==0)return;e.preventDefault();activated=false;stopHold();holdStart=performance.now();gear.setPointerCapture(e.pointerId);gearNote.textContent="Mantén pulsado para abrir Configuración…";holdTimer=setTimeout(()=>{activated=true;stopHold();gearNote.textContent="Abriendo Configuración";window.location.href="../editor/"},2000);holdProgress()});
["pointerup","pointercancel","lostpointercapture"].forEach(type=>gear.addEventListener(type,()=>{if(!activated&&holdTimer!==null){stopHold();gearNote.textContent="Mantén pulsado durante 2 segundos"}}));
gear.addEventListener("contextmenu",e=>e.preventDefault());
const presets=[{name:"Crystal Clean",drive:0,boost:0,reverb:10,delay:8},{name:"Worship Overdrive",drive:35,boost:0,reverb:18,delay:20},{name:"Worship Solo",drive:55,boost:0,reverb:20,delay:28}];
const DEFAULT_URL="../config/midi-hud-data-v1.json";let library=null, songIndex=0;
function validLibrary(x){return x&&x.format==="midi-hud-repertoire"&&x.schemaVersion==="1.0.0"&&typeof x.libraryId==="string"&&Number.isInteger(x.revision)&&x.midi&&Array.isArray(x.repertoires)&&Array.isArray(x.songs)&&Array.isArray(x.presets)&&x.presets.length>0&&x.presets.every(p=>typeof p.id==="string"&&typeof p.name==="string"&&Number.isInteger(p.programChange)&&p.morph&&Number.isInteger(p.morph.onLoad)&&p.morph.onLoad>=0&&p.morph.onLoad<=127)&&x.songs.every(song=>Array.isArray(song.presetIds)&&song.presetIds.every(id=>x.presets.some(p=>p.id===id)))&&x.repertoires.every(rep=>Array.isArray(rep.songIds)&&rep.songIds.every(id=>x.songs.some(song=>song.id===id)))}
function availableSongs(){const rep=library?.repertoires?.[0];return (rep?.songIds||[]).map(id=>library.songs.find(s=>s.id===id)).filter(Boolean)}
function selectSong(i){const songs=availableSongs();if(!songs.length)return; songIndex=(i+songs.length)%songs.length;const song=songs[songIndex];const chosen=(song.presetIds||[]).map(id=>library.presets.find(p=>p.id===id)).filter(Boolean);if(!chosen.length){document.querySelector("#ioStatus").textContent="La canción no tiene presets";return}
presets.splice(0,presets.length,...chosen.map(p=>({name:p.name,drive:p.morph.assignment==="soloBoost"?55:p.morph.assignment==="none"?35:0,morph:p.morph})));
const nav=document.querySelector("#presetNav");nav.replaceChildren(...presets.map((p,i)=>{const b=document.createElement("button");b.dataset.i=i;b.innerHTML="<span class=\"num\">"+(i+1)+"</span>"+p.name.toUpperCase();b.onclick=()=>{state=i;morph.value=0;draw()};return b}));
const picker=document.querySelector("#songPicker");picker.replaceChildren(...songs.map((s,i)=>new Option((i+1)+". "+s.title,i)));picker.value=String(songIndex);document.querySelector("#songCounter").textContent="CANCIÓN "+(songIndex+1)+" DE "+songs.length;document.querySelector("#songTempo").textContent=(song.key||song.keySignature||"Tonalidad no definida")+" · "+(song.tempoBpm? song.tempoBpm+" BPM":"BPM no definido");document.querySelector("#songName").textContent=song.title;state=0;morph.value=0;draw();}
function applyLibrary(x){if(!validLibrary(x))throw Error("Formato inválido o versión no compatible");library=x;selectSong(0);document.querySelector("#ioStatus").textContent="Cargado: "+(x.repertoires[0]?.name||x.libraryId)+" · revisión "+x.revision}
document.querySelector("#prevSong").onclick=()=>selectSong(songIndex-1);
document.querySelector("#nextSong").onclick=()=>selectSong(songIndex+1);
document.querySelector("#songPicker").onchange=e=>selectSong(Number(e.target.value));

async function loadDefault(){try{if(isLab&&!localStorage.getItem(libraryStorageKey)){const original=localStorage.getItem("hudLibrary");if(original)localStorage.setItem(libraryStorageKey,original)}const saved=localStorage.getItem(libraryStorageKey);if(saved){applyLibrary(JSON.parse(saved));return}const response=await fetch(DEFAULT_URL);if(!response.ok)throw Error("No se pudo cargar el ejemplo");applyLibrary(await response.json())}catch(e){document.querySelector("#ioStatus").textContent="Ejemplo integrado. "+e.message}}
document.querySelector("#exportBtn").onclick=()=>{if(!library){document.querySelector("#ioStatus").textContent="Espera a cargar un repertorio";return}const file=new Blob([JSON.stringify(library,null,2)],{type:"application/json"});const url=URL.createObjectURL(file),a=document.createElement("a");a.href=url;a.download="MIDI-HUD-repertorio.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);document.querySelector("#ioStatus").textContent="Archivo preparado para guardar o compartir"};
document.querySelector("#importBtn").onclick=()=>document.querySelector("#fileInput").click();
document.querySelector("#fileInput").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>500000)throw Error("Archivo demasiado grande");const x=JSON.parse(await f.text());if(!validLibrary(x))throw Error("Archivo JSON no compatible");applyLibrary(x);localStorage.setItem(libraryStorageKey,JSON.stringify(x))}catch(err){document.querySelector("#ioStatus").textContent="No se importó: "+err.message}e.target.value=""};
let state=0;
const morph=document.querySelector("#morph"),volume=document.querySelector("#volume");
morph.value=0;volume.value=localStorage.getItem(volumeStorageKey)??100;
function draw(){const p=presets[state],m=Number(morph.value)/100,assignment=p.morph?.assignment||(state===0?"ambient":state===2?"soloBoost":"none"),params=p.morph?.parameters||{};document.querySelectorAll("nav button").forEach((b,i)=>b.classList.toggle("active",i===state));document.querySelector("#title").textContent=p.name;document.querySelector("#tone").textContent="Twin Reverb '65 · Drive "+p.drive+"%";morph.disabled=assignment==="none";document.querySelector("#mv").textContent=assignment==="none"?"sin asignación":Math.round(m*100)+"%";document.querySelector("#effect").textContent=assignment==="ambient"?"Ambiente: reverb larga "+Math.round((params.reverbLongPercent?.[0]??10)+((params.reverbLongPercent?.[1]??75)-(params.reverbLongPercent?.[0]??10))*m)+"% · delay "+Math.round((params.delayPercent?.[0]??8)+((params.delayPercent?.[1]??60)-(params.delayPercent?.[0]??8))*m)+"%":assignment==="soloBoost"?"Boost solo: +"+((params.boostDb?.[0]??0)+((params.boostDb?.[1]??3)-(params.boostDb?.[0]??0))*m).toFixed(1)+" dB":"Overdrive estable · sin Morph";document.querySelector("#vv").textContent=volume.value+"%";document.querySelector("#status").textContent=Number(volume.value)===0?"Silencio global (ambas rutas)":"Volumen de ambas rutas: "+volume.value+"%";localStorage.setItem(stateStorageKey,state);localStorage.setItem(volumeStorageKey,volume.value)}
morph.oninput=draw;volume.oninput=draw;document.querySelector("#wah").oninput=e=>document.querySelector("#wv").textContent=e.target.value+"%";draw();loadDefault();window.addEventListener("pageshow",()=>{const saved=localStorage.getItem(libraryStorageKey);if(saved){try{const x=JSON.parse(saved);if(!library||JSON.stringify(x)!==JSON.stringify(library))applyLibrary(x)}catch(e){document.querySelector("#ioStatus").textContent="Error al actualizar repertorio: "+e.message}}});
</script></html>
