<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reinicio de biblioteca MIDI HUD QA</title>
<main>
<h1>Reinicio de biblioteca MIDI HUD QA</h1>
<p>La biblioteca preparada contiene solo «Quão Grande É o Meu Deus». Conecta la misma cuenta de Google que usas en MIDI HUD QA.</p>
<button id="authorize" disabled>Conectar con Google</button>
<p id="status" role="status">Cargando.</p>
</main>
<script type="module">
import {GoogleDriveAuth,loadGoogleIdentity} from './core/google-drive-auth.mjs';
import {DriveHistory,validateCommit} from './core/drive-sync.mjs';
import {canonical,checkedLibrary} from './core/sync-merge.mjs';
const byId=id=>document.getElementById(id);
const status=message=>byId('status').textContent=message;
const kind='midi-hud-test-sync-20261127-v1';
const revision='9e7965fd-52eb-4ddd-baf8-9e50381fedcc';
const sourceHash="a316bf2311086cac3a335902589927ca2f47fba8c7d9b0ee03c21d6cd8076de2";
const initialHash="b5516734752cc05f33fcb311e7c0d13c2b9b33e98674eaa47efbf9ed91e8ed76";
const exportedAt="2026-11-27T20:31:44.389Z";
let auth, account, candidate;
const ordered=value=>Array.isArray(value)?value.map(ordered):
 value&&typeof value==='object'?Object.fromEntries(Object.keys(value).sort().map(key=>[key,ordered(value[key])])):value;
async function digest(value){
 const bytes=new TextEncoder().encode(JSON.stringify(ordered(value)));
 return [...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');
}
async function oldHistory(){
 const history=new DriveHistory(request=>auth.request(request));
 const {graph,heads}=await history.list();
 if(graph.size!==4||canonical(heads)!==canonical(["881f916d-e9bf-49f4-bc44-44e2edb9fab0"]))throw Error('La cuenta o el historial no coinciden con el respaldo.');
 const versions=[];
 for(const entry of graph.values()){
  const commit=await getFile(entry.fileId);
  validateCommit(commit,entry);
  versions.push({fileId:entry.fileId,commit});
 }
 versions.sort((a,b)=>a.commit.id.localeCompare(b.commit.id));
 if(await digest({heads,versions})!==sourceHash)throw Error('El contenido de Drive difiere del respaldo.');
 const current=await history.list();
 if(canonical([...current.graph].sort())!==canonical([...graph].sort()))throw Error('El historial cambió durante el cotejo.');
 return versions.find(item=>item.commit.id===heads[0]).commit.library;
}
async function buildCandidate(library){
 const song=library.songs.find(item=>item.id==='quao-grande');
 const states=library.states.filter(state=>state.songId===song.id);
 const stateIds=new Set(states.map(state=>state.id));
 const indicatorIds=new Set(states.flatMap(state=>(state.indicators||[]).map(indicator=>indicator.id)));
 const repertoire=library.repertoires.find(item=>item.songIds.includes(song.id));
 const bindings=library.bindings.flatMap(binding=>{
  const actions=binding.actions.filter(action=>
   (!action.songId||action.songId===song.id)&&(!action.stateId||stateIds.has(action.stateId))&&(!action.indicatorId||indicatorIds.has(action.indicatorId)));
  return actions.length?[{...binding,actions}]:[];
 });
 const initial={...library,libraryId:'midi-hud-qa-20261127',revision:1,
  repertoires:[{id:repertoire.id,name:repertoire.name,songIds:[song.id]}],
  songs:[song],states,bindings,updatedAt:exportedAt};
 checkedLibrary(initial);
 if(await digest(initial)!==initialHash)throw Error('La biblioteca preparada no coincide con la copia verificada.');
 return initial;
}
function getFile(id){
 if(!/^[A-Za-z0-9_-]{8,100}$/.test(id))throw Error('Identificador de Drive inválido.');
 return auth.request({method:'GET',path:'/drive/v3/files/'+id,query:{alt:'media'}});
}
async function listNew(){
 const files=[];
 let pageToken;
 do{
  const page=await auth.request({method:'GET',path:'/drive/v3/files',query:{spaces:'appDataFolder',q:"trashed = false and appProperties has { key='kind' and value='"+kind+"' }",fields:'nextPageToken,files(id,appProperties)',...(pageToken?{pageToken}:{})}});
  files.push(...page.files);
  pageToken=page.nextPageToken;
 }while(pageToken);
 return files;
}
async function verify(files){
 if(files.length!==1||files[0].appProperties?.commitId!==revision)throw Error('La nueva identidad de Drive contiene revisiones inesperadas.');
 const commit=await getFile(files[0].id);
 if(commit.format!==kind||commit.version!==1||commit.id!==revision||!Array.isArray(commit.parents)||commit.parents.length||canonical(commit.library)!==canonical(candidate))throw Error('La revisión inicial de Drive no coincide con los datos preparados.');
 status('Drive verificado. Una canción. Archivo '+files[0].id+' · Revisión '+revision+'.');
}
async function put(){
 const metadata={name:'MIDI-HUD-'+revision+'.json',mimeType:'application/json',parents:['appDataFolder'],appProperties:{kind,commitId:revision}};
 const commit={format:kind,version:1,id:revision,parents:[],createdAt:new Date().toISOString(),deviceId:crypto.randomUUID(),library:candidate};
 const boundary='hud_'+revision;
 const part=value=>'--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(value)+'\r\n';
 return auth.request({method:'POST',path:'/upload/drive/v3/files',query:{uploadType:'multipart',fields:'id'},headers:{'Content-Type':'multipart/related; boundary='+boundary},body:part(metadata)+part(commit)+'--'+boundary+'--\r\n'});
}
async function migrate(){
 status('Cotejando el respaldo con Drive…');
 candidate=await buildCandidate(await oldHistory());
 let existing=await listNew();
 if(existing.length){await verify(existing);return;}
 status('Creando la biblioteca de una canción en Drive…');
 const result=await put();
 if(!result.id)throw Error('Drive no confirmó la nueva revisión.');
 for(let attempt=0;attempt<5;attempt++){
  existing=await listNew();
  if(existing.length)break;
  await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));
 }
 await verify(existing);
}

try{
 const config=await fetch('./config/cloud-sync.json',{cache:'no-store'});
 if(!config.ok)throw Error('Falta la configuración de Google.');
 const {googleWebClientId}=await config.json();
 auth=new GoogleDriveAuth({clientId:googleWebClientId});
 account=await auth.restore();
 await loadGoogleIdentity();
 status('Biblioteca preparada. Conecta tu cuenta de MIDI HUD QA.');
 byId('authorize').disabled=false;
 byId('authorize').onclick=()=>{
  byId('authorize').disabled=true;
  status(account?'Restableciendo la sesión de MIDI HUD QA…':'Elige la cuenta en la ventana de Google…');
  (account?Promise.resolve(account):auth.connect()).then(next=>{account=next;return migrate();})
   .catch(error=>{account=null;status(error.message);}).finally(()=>byId('authorize').disabled=false);
 };
}catch(e){status(e.message);}
</script>
</html>
