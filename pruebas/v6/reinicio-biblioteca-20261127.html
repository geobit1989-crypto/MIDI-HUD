<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reinicio de biblioteca MIDI HUD QA</title>
<main>
<h1>Reinicio de biblioteca MIDI HUD QA</h1>
<label>Respaldo verificado <input id="backup" type="file" accept=".json"></label>
<label>Biblioteca de una canción <input id="candidate" type="file" accept=".json"></label>
<button id="authorize" disabled>Conectar con Google</button>
<button id="activate" disabled>Crear biblioteca en Drive</button>
<p id="status" role="status">Cargando.</p>
</main>
<script type="module">
import {GoogleDriveAuth,loadGoogleIdentity} from './core/google-drive-auth.mjs';
import {DriveHistory,validateCommit} from './core/drive-sync.mjs';
import {canonical,checkedLibrary} from './core/sync-merge.mjs';
const byId=id=>document.getElementById(id);
const status=message=>byId('status').textContent=message;
const kind='midi-hud-test-sync-20261127-v1';
const revision='9e7965fd-52eb-4ddd-baf8-9e50381fedcc';
const legacy='midi-hud-test-sync-v1';
let auth, archive, candidate;
async function readInput(id,expected){
 const file=byId(id).files[0];
 if(!file||file.size>3_000_000)throw Error('Selecciona los dos archivos verificados.');
 const bytes=await file.arrayBuffer();
 const sha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');
 if(sha!==expected)throw Error('El archivo seleccionado no coincide con la copia verificada.');
 return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
}
async function oldHistory(){
 const history=new DriveHistory(request=>auth.request(request));
 const {graph,heads}=await history.list();
 if(!graph.size||graph.size!==archive.versions.length||canonical(heads)!==canonical(archive.heads))throw Error('La cuenta o el historial no coinciden con el respaldo.');
 for(const {fileId,commit} of archive.versions){
  const entry=graph.get(commit.id);
  if(entry?.fileId!==fileId)throw Error('El archivo de Drive difiere del respaldo.');
  const content=await getFile(fileId);
  validateCommit(content,entry);
  if(canonical(content)!==canonical(commit))throw Error('El contenido de Drive difiere del respaldo.');
 }
 const current=await history.list();
 if(canonical([...current.graph].sort())!==canonical([...graph].sort()))throw Error('El historial cambió durante el cotejo.');
}
function getFile(id){
 if(!/^[A-Za-z0-9_-]{8,100}$/.test(id))throw Error('Identificador de Drive inválido.');
 return auth.request({method:'GET',path:'/drive/v3/files/'+id,query:{alt:'media'}});
}
async function listNew(){
 const files=[];
 let pageToken;
 do{
  const page=await auth.request({method:'GET',path:'/drive/v3/files',query:{spaces:'appDataFolder',q:"trashed = false and appProperties has { key='kind' and value='"+kind+"' }",fields:'nextPageToken,files(id,appProperties)',...(pageToken?{pageToken}:{})}});
  files.push(...page.files);
  pageToken=page.nextPageToken;
 }while(pageToken);
 return files;
}
async function verify(files){
 if(files.length!==1||files[0].appProperties?.commitId!==revision)throw Error('La nueva identidad de Drive contiene revisiones inesperadas.');
 const commit=await getFile(files[0].id);
 if(commit.format!==kind||commit.version!==1||commit.id!==revision||!Array.isArray(commit.parents)||commit.parents.length||canonical(commit.library)!==canonical(candidate))throw Error('La revisión inicial de Drive no coincide con los datos preparados.');
 status('Drive verificado. Una canción. Archivo '+files[0].id+' · Revisión '+revision+'.');
}
async function put(){
 const metadata={name:'MIDI-HUD-'+revision+'.json',mimeType:'application/json',parents:['appDataFolder'],appProperties:{kind,commitId:revision}};
 const commit={format:kind,version:1,id:revision,parents:[],createdAt:new Date().toISOString(),deviceId:crypto.randomUUID(),library:candidate};
 const boundary='hud_'+revision;
 const part=value=>'--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(value)+'\r\n';
 return auth.request({method:'POST',path:'/upload/drive/v3/files',query:{uploadType:'multipart',fields:'id'},headers:{'Content-Type':'multipart/related; boundary='+boundary},body:part(metadata)+part(commit)+'--'+boundary+'--\r\n'});
}
async function prepare(){
 const [saved,initial]=await Promise.all([
  readInput('backup','b0910a6dbe5c6af462b505f167e643923f7a8ffac4688c4134be8eab29b37b70'),
  readInput('candidate','a83cb52afda5d3acad31536bcb4c1cdc1e8d506f096ac038f4337394703b1389')
 ]);
 if(saved.kind!==legacy)throw Error('El respaldo pertenece a otro historial.');
 checkedLibrary(initial);
 if(initial.libraryId!=='midi-hud-qa-20261127'||initial.songs.length!==1||initial.songs[0].id!=='quao-grande'||initial.repertoires.length!==1)throw Error('Se esperaba exclusivamente Quão Grande É o Meu Deus.');
 archive=saved;candidate=initial;
 await oldHistory();
 const existing=await listNew();
 if(existing.length){await verify(existing);return;}
 status('Respaldo cotejado con Drive. Lista para crear la biblioteca de una canción.');
 byId('activate').disabled=false;
}
try{
 const config=await fetch('./config/cloud-sync.json',{cache:'no-store'});
 if(!config.ok)throw Error('Falta la configuración de Google.');
 const {googleWebClientId}=await config.json();
 auth=new GoogleDriveAuth({clientId:googleWebClientId});
 await loadGoogleIdentity();
 status('Selecciona el respaldo y la biblioteca verificada.');
 byId('authorize').disabled=false;
 byId('authorize').onclick=()=>{
  byId('authorize').disabled=true;
  byId('activate').disabled=true;
  auth.restore().then(account=>account||auth.connect()).then(prepare).catch(e=>status(e.message)).finally(()=>byId('authorize').disabled=false);
 };
 byId('activate').onclick=async()=>{
  byId('activate').disabled=true;
  byId('authorize').disabled=true;
  try{
   await oldHistory();
   let existing=await listNew();
   if(!existing.length){
    const result=await put();
    if(!result.id)throw Error('Drive no confirmó la nueva revisión.');
    existing=await listNew();
   }
   await verify(existing);
  }catch(e){status(e.message+' Comprueba el estado antes de reintentar.');}
  finally{byId('authorize').disabled=false;}
 };
}catch(e){status(e.message);}
</script>
</html>
